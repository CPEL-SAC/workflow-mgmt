name: Build and Deploy to Cloud Run

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      project_id:
        required: true
        type: string
      environment:
        required: false
        type: string
        default: 'dev'
      region:
        required: false
        type: string
        default: 'us-central1'
      dockerfile:
        required: false
        type: string
        default: 'dockerfile'
      registry_name:
        required: false
        type: string
        default: 'cloudrun-images'
      timeout:
        required: false
        type: string
        default: '3600'
      use_secret_manager:
        required: false
        type: boolean
        default: true
      # Nombre del secret en central-secrets. Default '' -> se arma como
      # '<service_name>-<environment>'. Se pasa explicito cuando el nombre del
      # servicio y el del secret difieren (ej. service 'juno' con secret
      # 'ganaya-backend-dev' durante una migracion).
      secret_name:
        required: false
        type: string
        default: ''
      # Env vars extra a mergear SOBRE el secret (formato "K=V,K2=V2"). Util para
      # overrides por-deploy sin tocar el secret compartido (ej. NODE_ENV=staging
      # en un deploy idle para no activar schedulers).
      extra_env_vars:
        required: false
        type: string
        default: ''
      # --- Red / egress (opt-in). Para salir por una IP estática (Cloud NAT):
      # egress de todo el trafico por la VPC -> el NAT usa la IP fija reservada.
      # Vacio = comportamiento anterior (egress gestionado por Google, IP efimera).
      vpc_network:
        required: false
        type: string
        default: ''
      vpc_subnet:
        required: false
        type: string
        default: ''
      vpc_egress:
        required: false
        type: string
        default: 'all-traffic'   # solo aplica si vpc_network != ''
      # Ingress: 'all' (directo/Cloudflare) | 'internal-and-cloud-load-balancing' (solo LB).
      # Vacio = no se toca (conserva lo que ya tenga el servicio).
      ingress:
        required: false
        type: string
        default: ''
      # 'true' | 'false' | '' (vacio = no se toca). Para APIs publicas detras de
      # Cloudflare/LB que autentican a nivel de app, usar 'true'.
      allow_unauthenticated:
        required: false
        type: string
        default: ''
      # --- Recursos y escalado (opt-in). Vacio = se conserva lo que ya tenga el
      # servicio, o el default de Cloud Run si es nuevo (512Mi / 1 CPU / min 0).
      # Declararlos aca evita que un deploy revierta un ajuste hecho a mano.
      memory:
        required: false
        type: string
        default: ''
      cpu:
        required: false
        type: string
        default: ''
      # min_instances > 0 elimina los arranques en frio (paridad con un dyno
      # siempre activo), a cambio de facturar la instancia en reposo.
      min_instances:
        required: false
        type: string
        default: ''
      max_instances:
        required: false
        type: string
        default: ''
      # Requests simultaneas por instancia. Bajarla acota la memoria por instancia
      # cuando la app acepta payloads grandes.
      concurrency:
        required: false
        type: string
        default: ''
      # Ruteo del trafico tras el deploy. Cloud Run RESPETA un pin explicito a una
      # revision (spec.traffic con revisionName en vez de latestRevision): si alguien
      # fijo una revision para hacer rollback, los deploys siguientes crean la revision
      # nueva pero NO la sirven. El pipeline queda en verde y produccion nunca cambia.
      # Con 'true' el deploy fuerza el ruteo a la ultima revision lista.
      # Vacio = no se toca (el que ya use latestRevision sigue igual).
      traffic_to_latest:
        required: false
        type: string
        default: ''
    secrets:
      gcp_credentials:
        required: true
      slack_webhook_url:
        required: false

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Generate image tag
      id: tag
      run: |
        TAG="${{ inputs.environment }}-$(git rev-parse --short HEAD)"
        URL="${{ inputs.region }}-docker.pkg.dev/${{ inputs.project_id }}/${{ inputs.registry_name }}/${{ inputs.service_name }}:${TAG}"
        echo "tag=${TAG}" >> $GITHUB_OUTPUT
        echo "url=${URL}" >> $GITHUB_OUTPUT

    - uses: docker/setup-buildx-action@v3

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.gcp_credentials }}

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker ${{ inputs.region }}-docker.pkg.dev --quiet

    - name: Ensure Artifact Registry exists
      run: |
        gcloud artifacts repositories describe ${{ inputs.registry_name }} \
          --location=${{ inputs.region }} \
          --project=${{ inputs.project_id }} || \
        gcloud artifacts repositories create ${{ inputs.registry_name }} \
          --repository-format=docker \
          --location=${{ inputs.region }} \
          --project=${{ inputs.project_id }}

    - name: Build and push image
      run: |
        # Resuelve el Dockerfile tolerando el casing (Linux es case-sensitive).
        # Usa el input si existe; si no, cae a Dockerfile/dockerfile en la raiz.
        DF="${{ inputs.dockerfile }}"
        if [ ! -f "$DF" ]; then
          if [ -f "Dockerfile" ]; then DF="Dockerfile"
          elif [ -f "dockerfile" ]; then DF="dockerfile"
          else echo "::error::No se encontro Dockerfile (probé '${{ inputs.dockerfile }}', 'Dockerfile', 'dockerfile')"; exit 1
          fi
        fi
        echo "Usando Dockerfile: $DF"
        docker build -f "$DF" -t "${{ steps.tag.outputs.url }}" .
        docker push "${{ steps.tag.outputs.url }}"

    - name: Deploy to Cloud Run
      run: |
        # Flags opt-in: si el input esta vacio no se agrega -> no cambia el comportamiento
        # de los repos que ya usan este reusable.
        EXTRA=""
        if [ -n "${{ inputs.vpc_network }}" ]; then
          EXTRA="$EXTRA --network=${{ inputs.vpc_network }} --subnet=${{ inputs.vpc_subnet }} --vpc-egress=${{ inputs.vpc_egress }}"
        fi
        if [ -n "${{ inputs.ingress }}" ]; then
          EXTRA="$EXTRA --ingress=${{ inputs.ingress }}"
        fi
        if [ "${{ inputs.allow_unauthenticated }}" = "true" ]; then
          EXTRA="$EXTRA --allow-unauthenticated"
        elif [ "${{ inputs.allow_unauthenticated }}" = "false" ]; then
          EXTRA="$EXTRA --no-allow-unauthenticated"
        fi
        if [ -n "${{ inputs.memory }}" ]; then
          EXTRA="$EXTRA --memory=${{ inputs.memory }}"
        fi
        if [ -n "${{ inputs.cpu }}" ]; then
          EXTRA="$EXTRA --cpu=${{ inputs.cpu }}"
        fi
        if [ -n "${{ inputs.min_instances }}" ]; then
          EXTRA="$EXTRA --min-instances=${{ inputs.min_instances }}"
        fi
        if [ -n "${{ inputs.max_instances }}" ]; then
          EXTRA="$EXTRA --max-instances=${{ inputs.max_instances }}"
        fi
        if [ -n "${{ inputs.concurrency }}" ]; then
          EXTRA="$EXTRA --concurrency=${{ inputs.concurrency }}"
        fi
        echo "Flags extra de deploy: ${EXTRA:-(ninguno)}"

        ENV_FLAG=""
        ENVFILE=/tmp/env-vars.json
        echo "{}" > "$ENVFILE"
        if [ "${{ inputs.use_secret_manager }}" = "true" ]; then
          SECRET_NAME="${{ inputs.secret_name }}"
          [ -z "$SECRET_NAME" ] && SECRET_NAME="${{ inputs.service_name }}-${{ inputs.environment }}"
          SECRET_DATA=$(gcloud secrets versions access latest \
            --secret="${SECRET_NAME}" \
            --project=central-secrets 2>/dev/null || echo "{}")
          [ -n "$SECRET_DATA" ] && echo "$SECRET_DATA" > "$ENVFILE"
        fi
        # Mergear extra_env_vars SOBRE el secret (override por-deploy).
        if [ -n "${{ inputs.extra_env_vars }}" ]; then
          EXTRA_ENV="${{ inputs.extra_env_vars }}" ENVFILE="$ENVFILE" python3 -c "import json,os; f=os.environ['ENVFILE']; d=json.load(open(f)); [d.__setitem__(p.split('=',1)[0].strip(), p.split('=',1)[1].strip()) for p in os.environ['EXTRA_ENV'].split(',') if '=' in p]; json.dump(d, open(f,'w'))"
        fi
        # Usar el file solo si tiene contenido real (no solo "{}").
        if [ "$(tr -d '[:space:]' < "$ENVFILE")" != "{}" ]; then
          ENV_FLAG="--env-vars-file $ENVFILE"
        fi

        gcloud run deploy ${{ inputs.service_name }} \
          --image ${{ steps.tag.outputs.url }} \
          --platform managed \
          --region ${{ inputs.region }} \
          --project ${{ inputs.project_id }} \
          --timeout=${{ inputs.timeout }} \
          $ENV_FLAG $EXTRA \
          --quiet

        rm -f /tmp/env-vars.json

        # --- Ruteo del trafico ---------------------------------------------------
        # `gcloud run deploy` NO pisa un pin explicito a una revision: es a proposito
        # (si fijaste una revision buena para salir de un incidente, el proximo deploy
        # no te vuelve a meter el codigo roto). El efecto secundario es que un servicio
        # fijado deja de recibir despliegues EN SILENCIO: el job da verde, la revision
        # queda Ready, y nadie sirve nada nuevo.
        if [ "${{ inputs.traffic_to_latest }}" = "true" ]; then
          echo "Ruteando el 100% del trafico a la ultima revision..."
          gcloud run services update-traffic ${{ inputs.service_name }} \
            --to-latest \
            --region ${{ inputs.region }} \
            --project ${{ inputs.project_id }} \
            --quiet
        else
          # Sin traffic_to_latest, al menos AVISAR si el servicio esta fijado: un deploy
          # que pasa pero no llega a produccion es el peor tipo de verde.
          PINNED=$(gcloud run services describe ${{ inputs.service_name }} \
            --region ${{ inputs.region }} --project ${{ inputs.project_id }} \
            --format="value(spec.traffic[0].revisionName)" 2>/dev/null || true)
          if [ -n "${PINNED}" ]; then
            echo "::warning::El servicio '${{ inputs.service_name }}' tiene el trafico FIJADO a la revision '${PINNED}'. La revision recien desplegada NO esta sirviendo. Usa traffic_to_latest: 'true' o corre 'gcloud run services update-traffic --to-latest'."
          fi
        fi

    # Este reusable no notificaba NADA: un deploy fallido a Cloud Run pasaba
    # desapercibido. Fallo -> siempre; exito -> solo prod (master), para no
    # llenar el canal con deploys de test rutinarios.
    - name: Notify Slack on Failure
      if: failure()
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.slack_webhook_url }}
      run: |
        if [ -n "$SLACK_WEBHOOK_URL" ]; then
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d '{
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *Cloud Run Deploy Fallido*\n*Service:* ${{ inputs.service_name }}\n*Project:* ${{ inputs.project_id }}\n*Actor:* ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver logs>"
                  }
                }
              ]
            }'
        fi

    - name: Notify Slack on Success
      if: success() && github.ref == 'refs/heads/master'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.slack_webhook_url }}
      run: |
        if [ -n "$SLACK_WEBHOOK_URL" ]; then
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d '{
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *Cloud Run Deploy Exitoso (prod)*\n*Service:* ${{ inputs.service_name }}\n*Project:* ${{ inputs.project_id }}\n*Actor:* ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver run>"
                  }
                }
              ]
            }'
        fi
